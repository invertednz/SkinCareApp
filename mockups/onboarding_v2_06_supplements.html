<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onboarding – Supplements</title>
    <style>
      :root {
        --surface: #ffffff;
        --surface-alt: #f7f8fa;
        --border: #e5e7eb;
        --charcoal: #111827;
        --muted: #6b7280;
        --disabled: #d1d5db;
        --accent: #a8edea;
        --grad: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b0b0c;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        color: var(--charcoal);
      }
      .frame {
        max-width: 420px;
        min-height: 800px;
        background: var(--surface);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
      }
      .top {
        position: sticky;
        top: 0;
        background: var(--surface);
        padding: 16px 16px 0;
        z-index: 10;
      }
      .bar {
        height: 3px;
        background: #eef2f4;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 75%;
        background: var(--grad);
      }
      .appbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }
      .lang {
        border: 1px solid var(--border);
        padding: 4px 8px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }
      main {
        padding: 24px 16px 96px;
        overflow-y: auto;
        max-height: calc(100vh - 200px);
      }
      h1 {
        font-size: 28px;
        line-height: 32px;
        margin: 0 0 8px;
        font-weight: 700;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 15px;
        line-height: 1.5;
      }
      .supp-card {
        background: #fff;
        border: 2px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .supp-card:hover {
        border-color: #c8d4e0;
      }
      .supp-card.selected {
        border-color: var(--accent);
        background: rgba(168, 237, 234, 0.08);
      }
      .supp-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .supp-card .icon {
        font-size: 32px;
        flex-shrink: 0;
      }
      .supp-card .label {
        flex: 1;
        font-weight: 700;
        font-size: 16px;
      }
      .supp-card .check {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-radius: 6px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
      }
      .supp-card.selected .check {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .time-pills {
        display: flex;
        gap: 8px;
      }
      .time-pill {
        padding: 8px 16px;
        border: 2px solid var(--border);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .time-pill:hover {
        border-color: #c8d4e0;
      }
      .time-pill.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .add-input {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .add-input input {
        flex: 1;
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 15px;
        font-family: inherit;
      }
      .add-input input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .add-input button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
      }
      .bottom {
        position: sticky;
        bottom: 0;
        background: linear-gradient(
          to top,
          #ffffff 70%,
          rgba(255, 255, 255, 0)
        );
        padding: 16px;
      }
      .cta {
        width: 100%;
        height: 56px;
        border-radius: 999px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(168, 237, 234, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <div class="appbar">
          <button
            aria-label="Back"
            style="
              background: none;
              border: none;
              font-size: 20px;
              cursor: pointer;
            "
          >
            ←
          </button>
          <span class="lang">EN</span>
        </div>
        <div class="bar"><div></div></div>
      </div>
      <main>
        <h1>Supplements</h1>
        <p>
          Select any supplements you're currently taking and when you take them.
        </p>

        <div class="supp-card selected">
          <div class="supp-top">
            <span class="icon">⚡</span>
            <span class="label">Zinc</span>
            <div class="check">✓</div>
          </div>
          <div class="time-pills">
            <div class="time-pill active">☀️ AM</div>
            <div class="time-pill">🌙 PM</div>
          </div>
        </div>

        <div class="supp-card selected">
          <div class="supp-top">
            <span class="icon">🐟</span>
            <span class="label">Omega-3</span>
            <div class="check">✓</div>
          </div>
          <div class="time-pills">
            <div class="time-pill active">☀️ AM</div>
            <div class="time-pill active">🌙 PM</div>
          </div>
        </div>

        <div class="supp-card">
          <div class="supp-top">
            <span class="icon">☀️</span>
            <span class="label">Vitamin D</span>
            <div class="check"></div>
          </div>
          <div class="time-pills">
            <div class="time-pill">☀️ AM</div>
            <div class="time-pill">🌙 PM</div>
          </div>
        </div>

        <div class="supp-card">
          <div class="supp-top">
            <span class="icon">🦠</span>
            <span class="label">Probiotics</span>
            <div class="check"></div>
          </div>
          <div class="time-pills">
            <div class="time-pill">☀️ AM</div>
            <div class="time-pill">🌙 PM</div>
          </div>
        </div>

        <div class="supp-card">
          <div class="supp-top">
            <span class="icon">💪</span>
            <span class="label">Collagen</span>
            <div class="check"></div>
          </div>
          <div class="time-pills">
            <div class="time-pill">☀️ AM</div>
            <div class="time-pill">🌙 PM</div>
          </div>
        </div>

        <div class="add-input">
          <input type="text" placeholder="Add another supplement..." />
          <button>Add</button>
        </div>
      </main>
      <div class="bottom">
        <button class="cta">Continue</button>
      </div>
    </div>
  </body>
</html>
